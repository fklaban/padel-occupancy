name: Scrape occupancy

on:
  schedule:
    # Every 30 min, 04:00–21:59 UTC = roughly 05/06:00 – 23/24:00 in Prague.
    # GitHub may start scheduled runs a few minutes late; that's fine.
    - cron: "5,35 4-21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Snapshot all venues
        run: python -m padel.scrape

      - name: Rebuild report
        if: always()
        run: python -m padel.report

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data.json
          git diff --cached --quiet && exit 0
          git commit -m "data: snapshot $(TZ=Europe/Prague date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
